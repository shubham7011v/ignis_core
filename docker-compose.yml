version: '3.8'

services:
  server:
    container_name: vivaah-prod
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8082:8080" # Expose on port 8082 to avoid conflicts with Veil (8080/8081)
    env_file:
      - ./server/.env
    environment:
      - GIN_MODE=release
      - DB_HOST=db
      - DB_PORT=5432
      - FIREBASE_CREDENTIALS_PATH=/root/firebase-adminsdk.json
    depends_on:
      - db
    volumes:
      # Mount Firebase credentials from host
      - ./server/firebase-adminsdk.json:/root/firebase-adminsdk.json
    networks:
      - vivaah-network
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: vivaah-db
    environment:
      POSTGRES_USER: ${DB_USER:-vivaah_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_pass}
      POSTGRES_DB: ${DB_NAME:-vivaah_db}
    volumes:
      - vivaah_pg_data:/var/lib/postgresql/data
    networks:
      - vivaah-network
    restart: unless-stopped

volumes:
  vivaah_pg_data:

networks:
  vivaah-network:
    driver: bridge
