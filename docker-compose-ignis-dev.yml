version: '3.8'

services:
  server:
    container_name: ignis-dev
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8082:8080" # Ignis Dev
    environment:
      - GIN_MODE=debug
      - PORT=${PORT:-8080}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-vivaah_user}
      - DB_PASSWORD=${DB_PASSWORD:-ignis_secure_pass_2026}
      - DB_NAME=${DB_NAME:-vivaah_db}
      - FIREBASE_CREDENTIALS_PATH=/root/firebase-adminsdk.json
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - DOMAINS=${DOMAINS:-dev-api.vivaah.iamsorry.in}
    depends_on:
      - db
    volumes:
      - ./server/firebase-adminsdk.json:/root/firebase-adminsdk.json
    networks:
      - ignis-dev-network
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: ignis-dev-db
    environment:
      POSTGRES_USER: vivaah_user
      POSTGRES_PASSWORD: ignis_secure_pass_2026
      POSTGRES_DB: vivaah_db
    volumes:
      - ignis_dev_pg_data:/var/lib/postgresql/data
    networks:
      - ignis-dev-network
    restart: unless-stopped

volumes:
  ignis_dev_pg_data:

networks:
  ignis-dev-network:
    driver: bridge
