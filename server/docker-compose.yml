version: '3.8'

services:
  ignis-dev:
    build:
      context: .
      args:
        - VERSION=${VERSION:-dev}
    container_name: ignis-dev
    restart: unless-stopped
    expose:
      - "8080" # Expose to internal network only (Caddy routes to this)
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_HOST=nexus-db
      - DB_PORT=5432
      - DB_USER=vites_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=vites_db
      - FIREBASE_CREDENTIALS_PATH=/app/firebase_credentials.json
      - ALLOWED_ORIGINS=*
      - TEMPLATES_DIR=/app/storage/templates
      - RENDER_OUTPUT_DIR=/app/storage/renders
    volumes:
      # Mount the Shared Secret from the VPS Host
      - /root/nexus/secrets/firebase.json:/app/firebase_credentials.json:ro
      # Persist storage
      - ./storage:/app/storage
    networks:
      - nexus-net

networks:
  nexus-net:
    external: true
