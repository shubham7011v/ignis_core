version: '3.8'

services:
  ignis-prod:
    build:
      context: .
      args:
        - VERSION=${VERSION:-prod}
    container_name: ignis-prod
    restart: unless-stopped
    expose:
      - "8081" # Expose to internal network only (Caddy routes to this)
    environment:
      - PORT=8081
      - GIN_MODE=release
      - DB_HOST=nexus-db-prod
      - DB_PORT=5432
      - DB_USER=vites_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=vites_db_prod
      - FIREBASE_CREDENTIALS_PATH=/app/firebase_credentials.json
      - ALLOWED_ORIGINS=https://vites.iamsorry.in
      - TEMPLATES_DIR=/app/storage/templates
      - RENDER_OUTPUT_DIR=/app/storage/renders
    volumes:
      # Mount the Prod Firebase Secret from the VPS Host
      - /root/nexus/secrets/firebase_prod.json:/app/firebase_credentials.json:ro
      # Persist storage
      - ./storage:/app/storage
    networks:
      - nexus-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

networks:
  nexus-net:
    external: true
