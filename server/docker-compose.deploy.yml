version: '3.8'

services:
  ignis-dev:
    build:
      context: .
      args:
        - VERSION=${VERSION:-dev}
    container_name: ignis-dev
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_HOST=nexus-db-dev
      - DB_PORT=5432
      - DB_USER=vites_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=vites_db_dev
      - GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - FIREBASE_CREDENTIALS_PATH=/app/firebase_credentials.json
      - ALLOWED_ORIGINS=*
      - TEMPLATES_DIR=/app/storage/templates
      - RENDER_OUTPUT_DIR=/app/storage/renders
    volumes:
      - /root/nexus/secrets/firebase.json:/app/firebase_credentials.json:ro
      - /root/nexus/secrets/google-sheets-key.json:/app/google-sheets-key.json:ro
      - ./storage:/app/storage
    networks:
      - nexus-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  nexus-net:
    external: true
