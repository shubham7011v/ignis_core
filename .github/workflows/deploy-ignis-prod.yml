name: Deploy Ignis Prod

on:
    push:
        tags:
            - "ignis_prod_v*"

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to Server via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  port: 22
                  envs: FIREBASE_JSON,DB_PASSWORD
                  script: |
                      export FIREBASE_JSON="${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
                      export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
                      APP_DIR="/opt/ignis/prod"
                      REPO_URL="https://github.com/shubham7011v/ignis_core.git"

                      echo "🚀 Deploying Ignis Prod (Vites) to $APP_DIR..."

                      mkdir -p $APP_DIR
                      cd $APP_DIR

                      if [ -d "ignis_core" ]; then
                          cd ignis_core
                          git fetch --all --tags
                          git checkout ${{ github.ref_name }}
                          cd ..
                      else
                          git clone $REPO_URL ignis_core
                          cd ignis_core
                          git checkout ${{ github.ref_name }}
                          cd ..
                      fi

                      # Setup Env (File-less for secrets)
                      cat <<EOF > ignis_core/server/.env
                      PORT=8080
                      GIN_MODE=release
                      DB_HOST=db
                      DB_PORT=5432
                      DB_USER=vites_user
                      DB_PASSWORD=$DB_PASSWORD
                      DB_NAME=vites_db
                      # FIREBASE_CREDENTIALS_PATH=/root/firebase-adminsdk.json # Not used
                      ALLOWED_ORIGINS=https://vites.iamsorry.in
                      DOMAINS=vites.iamsorry.in
                      EOF

                      # Copy docker-compose
                      cp ignis_core/docker-compose-ignis-prod.yml ./docker-compose.yml

                      # Run with inline secret
                      echo "🚀 Starting containers..."
                      export FIREBASE_CREDENTIALS_JSON="$FIREBASE_JSON"
                      docker compose build server
                      docker compose up -d --remove-orphans
                      docker system prune -f

                      sleep 10
                      if curl -s http://localhost:8083/health | grep "ok"; then
                          echo "✅ Ignis Prod Deployment Successful!"
                      else
                          echo "❌ Health check failed!"
                          docker compose logs --tail=50
                          exit 1
                      fi
