name: Promote Admin (DEV)

on:
    workflow_dispatch:
        inputs:
            email:
                description: "User Email"
                required: true

jobs:
    promote-dev:
        runs-on: ubuntu-latest
        steps:
            - name: Execute Promotion in DEV
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  port: 22
                  script: |
                      EMAIL="${{ github.event.inputs.email }}"
                      CONTAINER="vites-dev-db"
                      USER="vites_user"
                      DB="vites_db"

                      echo "🚀 Promoting $EMAIL to Admin in DEV..."

                      # Update
                      docker exec $CONTAINER psql -U $USER -d $DB -c "UPDATE users SET is_admin = true WHERE email = '$EMAIL';"

                      # Verify
                      RESULT=$(docker exec $CONTAINER psql -U $USER -d $DB -t -c "SELECT COUNT(*) FROM users WHERE email = '$EMAIL' AND is_admin = true;")
                      if [ $(echo "$RESULT" | tr -d '[:space:]') -gt 0 ]; then
                        echo "✅ Success: $EMAIL is now an Admin in DEV."
                      else
                        echo "❌ Error: Failed to promote $EMAIL."
                        exit 1
                      fi
