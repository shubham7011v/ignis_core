name: Promote User to Admin

on:
    workflow_dispatch:
        inputs:
            email:
                description: "Email of the user to promote"
                required: true
            environment:
                description: "Environment (dev or prod)"
                required: true
                default: "dev"
                type: choice
                options:
                    - dev
                    - prod

jobs:
    promote:
        runs-on: ubuntu-latest
        steps:
            - name: Execute Promotion over SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  port: 22
                  script: |
                      ENV="${{ github.event.inputs.environment }}"
                      EMAIL="${{ github.event.inputs.email }}"

                      if [ "$ENV" == "prod" ]; then
                        CONTAINER="ignis-prod-db"
                        USER="vivaah_user"
                        DB="vivaah_db"
                      else
                        CONTAINER="vites-dev-db"
                        USER="vites_user"
                        DB="vites_db"
                      fi

                      echo "🚀 Promoting $EMAIL to Admin in $ENV environment..."
                      docker exec $CONTAINER psql -U $USER -d $DB -c "UPDATE users SET is_admin = true WHERE email = '$EMAIL';"

                      RESULT=$(docker exec $CONTAINER psql -U $USER -d $DB -t -c "SELECT COUNT(*) FROM users WHERE email = '$EMAIL' AND is_admin = true;")
                      if [ "$RESULT" -gt 0 ]; then
                        echo "✅ Promotion completed successfully!"
                      else
                        echo "❌ User not found or promotion failed!"
                        exit 1
                      fi
