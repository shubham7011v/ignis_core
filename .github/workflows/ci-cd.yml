name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # Test Job
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run tests
        run: flutter test
        
      - name: Analyze code
        run: flutter analyze

  # Build Android (Development)
  build-android-dev:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Decode Firebase Config (Dev)
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_DEV_BASE64 }}
        run: echo "$FIREBASE_CONFIG_BASE64" | base64 -d > lib/config/firebase_options_dev.dart
        
      - name: Build APK (Dev)
        run: |
          flutter build apk \
            --dart-define=API_BASE_URL=${{ secrets.DEV_API_BASE_URL }} \
            --dart-define=APP_ENV=development \
            --release
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Build Android (Production)
  build-android-prod:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install dependencies
        run: flutter pub get
        
      - name: Decode Firebase Config (Prod)
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_CONFIG_PROD_BASE64 }}
        run: echo "$FIREBASE_CONFIG_BASE64" | base64 -d > lib/config/firebase_options_prod.dart
        
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF
          
      - name: Build APK (Prod)
        run: |
          flutter build apk \
            --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }} \
            --dart-define=APP_ENV=production \
            --release
            
      - name: Build App Bundle (Prod)
        run: |
          flutter build appbundle \
            --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }} \
            --dart-define=APP_ENV=production \
            --release
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

  # Server Tests & Build
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vivaah_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: vivaah_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Install dependencies
        working-directory: ./server
        run: go mod download
        
      - name: Run tests
        working-directory: ./server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: vivaah_user
          DB_PASSWORD: test_password
          DB_NAME: vivaah_test
        run: go test ./... -v
        
      - name: Build server
        working-directory: ./server
        run: go build -o vivaah-server ./cmd/server
