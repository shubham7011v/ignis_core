name: Deploy Ignis Dev

on:
    push:
        tags:
            - "ignis_dev_v*"

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Deploy to Server via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  FIREBASE_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: root
                  key: ${{ secrets.SSH_KEY }}
                  port: 22
                  envs: FIREBASE_JSON,DB_PASSWORD
                  script: |
                      # Extract version from tag
                      VERSION="${{ github.ref_name }}"
                      echo "Deploying version: $VERSION"

                      # Use env vars passed via 'envs', do NOT interpolate secrets directly
                      # export FIREBASE_JSON="$FIREBASE_JSON" # Already exported by action
                      # export DB_PASSWORD="$DB_PASSWORD" # Already exported by action
                      APP_DIR="/opt/ignis/dev"
                      REPO_URL="https://github.com/shubham7011v/ignis_core.git"

                      echo "🚀 Deploying Ignis Dev (Vites) to $APP_DIR..."

                      mkdir -p $APP_DIR
                      cd $APP_DIR

                      if [ -d "ignis_core" ]; then
                          cd ignis_core
                          git fetch --all --tags
                          git checkout ${{ github.ref_name }}
                          cd ..
                      else
                          git clone $REPO_URL ignis_core
                          cd ignis_core
                          git checkout ${{ github.ref_name }}
                          cd ..
                      fi

                      # Setup Env (File-less for secrets)
                      cat <<EOF > ignis_core/server/.env
                      PORT=8080
                      GIN_MODE=debug
                      DB_HOST=db
                      DB_PORT=5432
                      DB_USER=vites_user
                      DB_PASSWORD=$DB_PASSWORD
                      DB_NAME=vites_db
                      # FIREBASE_CREDENTIALS_PATH=/root/firebase-adminsdk.json # Not used
                      ALLOWED_ORIGINS=*
                      DOMAINS=dev.vites.iamsorry.in
                      EOF

                      # Build image with version
                      cd server
                      docker build --network=host --build-arg VERSION=$VERSION -t ignis-server:dev .

                      # Ensure docker-compose.yml is up to date
                      cp ignis_core/docker-compose-ignis-dev.yml ./docker-compose.yml

                      # Run with inline secret
                      echo "🚀 Starting containers..."
                      export FIREBASE_CREDENTIALS_JSON="$FIREBASE_JSON"

                      # Stop existing containers to avoid name conflicts
                      docker compose down --remove-orphans

                      # Start new containers
                      # We use the image 'ignis-server:dev' built above, so no need to build again
                      docker compose up -d --force-recreate
                      docker system prune -f

                      sleep 10
                      if curl -s http://localhost:8082/health | grep "ok"; then
                          echo "✅ Ignis Dev Deployment Successful!"
                      else
                          echo "❌ Health check failed!"
                          docker compose logs --tail=50
                          exit 1
                      fi

                      # Verify version
                      echo "Verifying deployed version..."
                      # Port 8082 for dev
                      DEPLOYED_VERSION=$(curl -s http://localhost:8082/api/version | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
                      echo "Expected: $VERSION"
                      echo "Deployed: $DEPLOYED_VERSION"

                      if [ "$DEPLOYED_VERSION" != "$VERSION" ]; then
                        echo "❌ Version mismatch! Expected $VERSION but got $DEPLOYED_VERSION"
                        exit 1
                      fi

                      echo "✅ Dev deployment verified! Version $VERSION matches."
