name: Debug Deployment Secrets

on:
    push:
        branches:
            - "**"
    workflow_dispatch:

jobs:
    debug:
        name: Check Secrets and Connectivity
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Verify Secret Presence & Format
              run: |
                  echo "--- Secret Status ---"
                  if [ -z "${{ secrets.SSH_KEY }}" ]; then 
                    echo "❌ SSH_KEY: MISSING OR EMPTY"
                  else 
                    echo "✅ SSH_KEY: Present (Length: ${#SSH_KEY_VAL})"
                    # Check for \r (Windows line endings)
                    if echo "$SSH_KEY_VAL" | grep -q $'\r'; then
                      echo "⚠️ WARNING: SSH_KEY contains Windows line endings (\r\n). This can break some SSH actions."
                    fi
                    # Check header/footer exactly
                    KEY_HEAD=$(echo "$SSH_KEY_VAL" | head -n 1)
                    KEY_FOOT=$(echo "$SSH_KEY_VAL" | tail -n 1)
                    echo "Header: [$KEY_HEAD]"
                    echo "Footer: [$KEY_FOOT]"
                    
                    if [[ "$KEY_HEAD" != "-----BEGIN OPENSSH PRIVATE KEY-----" && "$KEY_HEAD" != "-----BEGIN RSA PRIVATE KEY-----" ]]; then
                      echo "❌ ERROR: Key header is invalid or has hidden spaces!"
                    fi
                  fi
                  if [ -z "${{ secrets.SERVER_IP }}" ]; then echo "❌ SERVER_IP: MISSING OR EMPTY"; else echo "✅ SERVER_IP: Present"; fi
              env:
                  SSH_KEY_VAL: ${{ secrets.SSH_KEY }}

            - name: Verbose SSH Connection Test
              run: |
                  echo "--- Testing SSH Handshake ---"
                  # Create temporary key file
                  echo "${{ secrets.SSH_KEY }}" > debug_key
                  chmod 600 debug_key
                  # Try to connect and show verbose output of the handshake
                  ssh -i debug_key -o ConnectTimeout=10 -o StrictHostKeyChecking=no -v root@${{ secrets.SERVER_IP }} "exit" || true
                  rm debug_key
