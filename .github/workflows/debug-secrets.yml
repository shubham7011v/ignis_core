name: Debug Deployment Secrets

on:
    push:
        branches:
            - "**"
    workflow_dispatch:

jobs:
    debug:
        name: Check Secrets and Connectivity
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Verify Secret Presence
              run: |
                  echo "--- Secret Status ---"
                  if [ -z "${{ secrets.SSH_KEY }}" ]; then echo "❌ SSH_KEY: MISSING OR EMPTY"; else echo "✅ SSH_KEY: Present (Length: ${#SSH_KEY_VAL})"; fi
                  if [ -z "${{ secrets.SERVER_IP }}" ]; then echo "❌ SERVER_IP: MISSING OR EMPTY"; else echo "✅ SERVER_IP: Present"; fi
                  if [ -z "${{ secrets.DB_PASSWORD }}" ]; then echo "❌ DB_PASSWORD: MISSING OR EMPTY"; else echo "✅ DB_PASSWORD: Present"; fi
                  if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then echo "❌ FIREBASE_SERVICE_ACCOUNT: MISSING OR EMPTY"; else echo "✅ FIREBASE_SERVICE_ACCOUNT: Present"; fi
              env:
                  SSH_KEY_VAL: ${{ secrets.SSH_KEY }}

            - name: Network Connectivity Test
              run: |
                  echo "--- Testing connection to ${{ secrets.SERVER_IP }} ---"
                  nc -zv -w 5 ${{ secrets.SERVER_IP }} 22 || echo "❌ Cannot reach Port 22 on ${{ secrets.SERVER_IP }}"

            - name: Key Format Check
              run: |
                  echo "--- Checking Key Header ---"
                  echo "${{ secrets.SSH_KEY }}" | head -n 1
              continue-on-error: true
