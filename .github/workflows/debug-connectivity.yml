name: Debug Network Connectivity

on:
    push:
        branches:
            - "**"
    workflow_dispatch:

jobs:
    debug-connection:
        runs-on: ubuntu-latest
        environment: dev
        steps:
            - name: Test Connectivity
              env:
                  HOST: ${{ secrets.SERVER_IP }}
              run: |
                  sudo apt-get install -y traceroute
                  echo "Testing connectivity to $HOST..."
                  ping -c 4 $HOST || echo "Ping failed"
                  nc -zv $HOST 22 || echo "Port 22 unreachable"
                  # traceroute $HOST || echo "Traceroute failed" (noisy and often blocked)

            - name: Test SSH Handshake
              env:
                  SSH_KEY: ${{ secrets.SSH_KEY }}
                  HOST: ${{ secrets.SERVER_IP }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  # Try connecting with verbose output to see where it hangs/fails
                  ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@$HOST "echo 'SSH Connection Successful'"
